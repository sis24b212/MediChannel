server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# Database Configuration (PostgreSQL / Neon)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medichannel}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Colombo
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JSON Timezone (BR-11)
spring.jackson.time-zone=Asia/Colombo

# Application Security & Integration Properties
app.cors.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.encryption.key-base64=${ENCRYPTION_KEY_BASE64}
app.encryption.hmac-secret=${HMAC_SECRET}

# Initial Admin Bootstrap
app.admin.email=${INITIAL_ADMIN_EMAIL:admin@lankacare.lk}
app.admin.password=${INITIAL_ADMIN_PASSWORD:}
app.admin.name=${INITIAL_ADMIN_NAME:System Administrator}
app.seed.enabled=${SEED_DEMO_DATA:true}

# Logging (Keep logs clean, never log PII/tokens)
logging.level.root=INFO
logging.level.lk.lankacare.medichannel=INFO
